# mmc1.cfg - linker configuration: the map of our cartridge.
#
# The compiler turns our C into chunks of machine code and data, called
# segments. The linker (ld65) then places each segment at an address and
# writes the final ROM file. This file tells it where everything may go.
#
# Two sections:
#   MEMORY   - the physical places that exist: console RAM, save RAM, and
#              every 16 KB slice of the cartridge ROM ("bank" = slice).
#   SEGMENTS - which kind of content goes into which place.
#
# The processor's address map:
#   $0000-$07FF  console RAM (2 KB)
#   $6000-$7FFF  save RAM on the cartridge, kept alive by the battery
#   $8000-$BFFF  switchable bank: any one of banks 0-14 (one TV; banks are channels)
#   $C000-$FFFF  fixed bank: always bank 15 (a TV stuck on one channel)

MEMORY {
    # --- Console RAM. file = "" means "exists at run time, not in the ROM file".
    ZP:     start = $0000, size = $0100, type = rw, file = "";  # zero page: the fastest RAM to reach
    # $0100-$01FF is the processor's own stack, so we leave it alone.
    OAM:    start = $0200, size = $0100, type = rw, file = "";  # sprite list, copied to the screen every frame
    RAM:    start = $0300, size = $0500, type = rw, file = "", define = yes;  # everything else; the C stack grows down from the top

    # --- Save RAM on the cartridge: 8 KB that the battery keeps alive.
    SRAM:   start = $6000, size = $2000, type = rw, file = "";

    # --- The ROM file itself, in the order it is written to disk.
    HDR:    start = $0000, size = $0010, type = ro, file = %O, fill = yes;  # the 16-byte iNES header (header.s)

    # Slices 0-14: all appear at $8000 when swapped in. "bank" numbers them, and
    # fill = yes pads each to exactly 16 KB so slice N starts where the MMC1
    # expects it in the file, even while it is still empty.
    PRG00:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $00;
    PRG01:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $01;
    PRG02:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $02;
    PRG03:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $03;
    PRG04:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $04;
    PRG05:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $05;
    PRG06:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $06;
    PRG07:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $07;
    PRG08:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $08;
    PRG09:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $09;
    PRG10:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $0A;
    PRG11:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $0B;
    PRG12:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $0C;
    PRG13:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $0D;
    PRG14:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $0E;

    # Bank 15: the fixed bank at $C000.
    PRGFIX: start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF, bank = $0F;

    # Every bank, fixed or switchable, ends with the same 16-byte reset stub,
    # which includes the vectors: the three addresses the processor reads to
    # find the startup code, the vblank handler, and other interrupts.
    # See src/reset_stubs.s for why.

    # No graphics ROM: the board has graphics RAM instead, and the game copies
    # tiles into it from program ROM as needed. Our art only changes at scene
    # transitions (such as entering a battle), so the copying is cheap, and any
    # enemy can be paired with any background without pre-building tile sets.
}

SEGMENTS {
    # --- Run-time memory
    ZEROPAGE: load = ZP,   type = zp;
    OAM:      load = OAM,  type = bss, align = $100, optional = yes;
    BSS:      load = RAM,  type = bss, define = yes;  # C globals that start at zero
    SAVE:     load = SRAM, type = bss, optional = yes; # save data; never cleared at startup

    # --- The header
    HEADER:   load = HDR,  type = ro;

    # --- Switchable banks: data (maps, art, text) and,
    # later, code that has outgrown the fixed bank. Empty for now, hence optional.
    BANK00:   load = PRG00, type = ro, optional = yes;
    BANK01:   load = PRG01, type = ro, optional = yes;
    BANK02:   load = PRG02, type = ro, optional = yes;
    BANK03:   load = PRG03, type = ro, optional = yes;
    BANK04:   load = PRG04, type = ro, optional = yes;
    BANK05:   load = PRG05, type = ro, optional = yes;
    BANK06:   load = PRG06, type = ro, optional = yes;
    BANK07:   load = PRG07, type = ro, optional = yes;
    BANK08:   load = PRG08, type = ro, optional = yes;
    BANK09:   load = PRG09, type = ro, optional = yes;
    BANK10:   load = PRG10, type = ro, optional = yes;
    BANK11:   load = PRG11, type = ro, optional = yes;
    BANK12:   load = PRG12, type = ro, optional = yes;
    BANK13:   load = PRG13, type = ro, optional = yes;
    BANK14:   load = PRG14, type = ro, optional = yes;

    # Reset stubs: the last 16 bytes of each switchable bank. "start" pins each
    # one to the end; the linker reports an error if bank data ever grows into it.
    STUB00:   load = PRG00, type = ro, start = $BFF0;
    STUB01:   load = PRG01, type = ro, start = $BFF0;
    STUB02:   load = PRG02, type = ro, start = $BFF0;
    STUB03:   load = PRG03, type = ro, start = $BFF0;
    STUB04:   load = PRG04, type = ro, start = $BFF0;
    STUB05:   load = PRG05, type = ro, start = $BFF0;
    STUB06:   load = PRG06, type = ro, start = $BFF0;
    STUB07:   load = PRG07, type = ro, start = $BFF0;
    STUB08:   load = PRG08, type = ro, start = $BFF0;
    STUB09:   load = PRG09, type = ro, start = $BFF0;
    STUB10:   load = PRG10, type = ro, start = $BFF0;
    STUB11:   load = PRG11, type = ro, start = $BFF0;
    STUB12:   load = PRG12, type = ro, start = $BFF0;
    STUB13:   load = PRG13, type = ro, start = $BFF0;
    STUB14:   load = PRG14, type = ro, start = $BFF0;

    # --- Fixed bank: everything that must always be reachable.
    # Startup code and the vblank handler can run at any moment, whatever bank
    # is switched in, and code that switches banks can't live in the bank it is
    # switching out. All our code starts here; it moves out only if it outgrows 16 KB.
    STARTUP:  load = PRGFIX, type = ro, define = yes, optional = yes;  # power-on code
    CODE:     load = PRGFIX, type = ro, define = yes, optional = yes;  # all our compiled C, for now
    LOWCODE:  load = PRGFIX, type = ro, optional = yes;
    ONCE:     load = PRGFIX, type = ro, optional = yes;
    INIT:     load = PRGFIX, type = ro, optional = yes;
    RODATA:   load = PRGFIX, type = ro, define = yes, optional = yes;  # constant data the C code uses directly
    # C globals with a starting value: stored in ROM, copied to RAM at startup.
    DATA:     load = PRGFIX, run = RAM, type = rw, define = yes, optional = yes;
    STUB15:   load = PRGFIX, type = ro, start = $FFF0;  # the fixed bank's stub and vectors
}

FEATURES {
    # Bookkeeping the C runtime library expects; it lists start-up and shut-down
    # routines. We don't use them, but the library looks for these labels.
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
